# SM Nimco — host Nginx reverse proxy
# Upstreams bind only on 127.0.0.1 (Docker compose host ports 3200–3202).
# Install:
#   sudo cp deploy/smnimco/nginx/smnimco.com.conf /etc/nginx/sites-available/smnimco.com.conf
#   sudo ln -sf /etc/nginx/sites-available/smnimco.com.conf /etc/nginx/sites-enabled/smnimco.com.conf
#   sudo nginx -t && sudo systemctl reload nginx

upstream smnimco_storefront {
  server 127.0.0.1:3201;
  keepalive 8;
}

upstream smnimco_admin {
  server 127.0.0.1:3202;
  keepalive 8;
}

upstream smnimco_api {
  server 127.0.0.1:3200;
  keepalive 8;
}

# ---------------------------------------------------------------------------
# Storefront — smnimco.com + www.smnimco.com
# ---------------------------------------------------------------------------
server {
  listen 80;
  listen [::]:80;
  server_name smnimco.com www.smnimco.com;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    proxy_pass http://smnimco_storefront;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}

# ---------------------------------------------------------------------------
# Admin — admin.smnimco.com
# ---------------------------------------------------------------------------
server {
  listen 80;
  listen [::]:80;
  server_name admin.smnimco.com;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    proxy_pass http://smnimco_admin;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}

# ---------------------------------------------------------------------------
# API + uploads — api.smnimco.com
# ---------------------------------------------------------------------------
server {
  listen 80;
  listen [::]:80;
  server_name api.smnimco.com;

  client_max_body_size 10M;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    proxy_pass http://smnimco_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}

